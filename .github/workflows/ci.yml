name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-lint-and-test:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: risklens
          POSTGRES_PASSWORD: risklens_password
          POSTGRES_DB: risklens_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (Linting)
        working-directory: ./backend
        run: ruff check .

      - name: Run Black (Formatting Check)
        working-directory: ./backend
        run: black --check .

      - name: Run mypy (Type Checking)
        working-directory: ./backend
        run: mypy .

      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://risklens:risklens_password@localhost:5432/risklens_db
        run: alembic upgrade head

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://risklens:risklens_password@localhost:5432/risklens_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key
          FINNHUB_API_KEY: test_finnhub_key
          ANTHROPIC_API_KEY: test_anthropic_key
        run: pytest -v

  frontend-lint-and-test:
    name: Frontend Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint:check

      - name: Run Prettier check
        working-directory: ./frontend
        run: npm run format:check

      - name: Run TypeScript type checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start services using Docker Compose
        run: |
          docker compose up -d postgres redis api ingestion_worker fast_path_worker slow_path_worker garch_worker regime_worker job_worker decision_engine_worker slack_bot
        env:
          DATABASE_URL: postgresql+asyncpg://risklens:risklens_password@localhost:5432/risklens_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key
          FINNHUB_API_KEY: test_finnhub_key
          ANTHROPIC_API_KEY: test_anthropic_key

      - name: Wait for API to be healthy
        run: |
          until curl -s http://localhost:8000/health; do
            echo "Waiting for API..."
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

      - name: Start frontend
        working-directory: ./frontend
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws

      - name: Run Playwright Tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
