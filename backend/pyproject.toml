[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "quant", "workers", "slack_bot"]

[project]
name = "risklens-backend"
version = "0.1.0"
description = "RiskLens — quantitative risk monitoring backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "slowapi>=0.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "redis>=5.0",
    "websockets>=12.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "arch>=7.0",
    "arq>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

# ── Black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]

# ── Mypy (type-checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
