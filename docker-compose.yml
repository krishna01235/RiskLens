# RiskLens — Docker Compose
#
# Brings up: postgres, redis, api, frontend, worker (placeholder).
# All real worker services are added incrementally as their phases land.
#
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up             # start the stack
#   docker compose down -v        # stop and remove volumes

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risklens}
      POSTGRES_DB: ${POSTGRES_DB:-risklens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - risklens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risklens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - risklens
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application ──────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override localhost URLs to use Docker service names
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - risklens

  # ── Ingestion worker (Phase 6) ────────────────────────────────────────────────
  ingestion_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.ingestion_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── Fast Path worker (Phase 9) ────────────────────────────────────────────────
  fast_path_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.fast_path_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── Slow Path worker (Phase 10) ───────────────────────────────────────────────
  slow_path_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.slow_path_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── GARCH worker (Phase 11) ───────────────────────────────────────────────────
  garch_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.garch_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── Job Worker (arq -- Monte Carlo simulations) ──────────────────────────────
  job_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "arq", "workers.job_worker.WorkerSettings"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── Regime Worker (Phase 16) ─────────────────────────────────────────────────
  regime_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.regime_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

  # ── Decision Engine Worker (Phase 17) ────────────────────────────────────────
  decision_engine_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "workers.decision_engine_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  risklens:
    driver: bridge
