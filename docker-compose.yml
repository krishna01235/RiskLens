# RiskLens — Docker Compose
#
# Brings up: postgres, redis, api, frontend, worker (placeholder).
# All real worker services are added incrementally as their phases land.
#
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up             # start the stack
#   docker compose down -v        # stop and remove volumes

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risklens}
      POSTGRES_DB: ${POSTGRES_DB:-risklens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - risklens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risklens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - risklens
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application ──────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override localhost URLs to use Docker service names
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - risklens

  # ── Placeholder worker ────────────────────────────────────────────────────────
  # Proves the worker container pattern works. Real workers (fast_path_worker,
  # slow_path_worker, garch_worker, etc.) are added as their phases land.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "-c", "import time, sys; print('placeholder worker running', flush=True); time.sleep(86400)"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risklens}:${POSTGRES_PASSWORD:-risklens}@postgres:5432/${POSTGRES_DB:-risklens}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - risklens

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  risklens:
    driver: bridge
